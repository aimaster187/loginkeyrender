name: PRANAV Build & Standalone DEX

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      render_url:
        description: 'Live Render Admin URL to bake into pranav_gate.dex (optional)'
        required: false
        default: ''
      github_fallback_url:
        description: 'GitHub Raw config.json fallback URL (optional)'
        required: false
        default: ''

jobs:
  android-build:
    name: Build PRANAV APK & Standalone DEX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Inject Live Render URL into PranavGate (if provided)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_url != '' }}
        env:
          RENDER_URL: ${{ inputs.render_url }}
          GITHUB_FALLBACK: ${{ inputs.github_fallback_url }}
        run: |
          python3 - << 'EOF'
          import os, pathlib
          p = pathlib.Path("app/src/main/java/com/pranav/guard/PranavGate.java")
          src = p.read_text()
          r_url = os.environ.get("RENDER_URL", "").strip().rstrip("/")
          g_url = os.environ.get("GITHUB_FALLBACK", "").strip()
          src = src.replace(
              'public static volatile String DEFAULT_RENDER_URL = "";',
              f'public static volatile String DEFAULT_RENDER_URL = "{r_url}";'
          )
          if g_url:
              src = src.replace(
                  'public static volatile String DEFAULT_GITHUB_FALLBACK_URL = "";',
                  f'public static volatile String DEFAULT_GITHUB_FALLBACK_URL = "{g_url}";'
              )
          p.write_text(src)
          print("Baked DEFAULT_RENDER_URL =", r_url)
          EOF

      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MGR="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build Standalone Single-Class pranav_gate.dex
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANDROID_JAR="$(find "$SDK_ROOT/platforms" -name android.jar | sort -V | tail -n 1)"
          D8_BIN="$(find "$SDK_ROOT/build-tools" -name d8 -type f | sort -V | tail -n 1)"
          echo "Using ANDROID_JAR=$ANDROID_JAR"
          echo "Using D8_BIN=$D8_BIN"
          mkdir -p build-dex/classes build-dex/out
          javac --release 11 -cp "$ANDROID_JAR" -d build-dex/classes app/src/main/java/com/pranav/guard/PranavGate.java
          "$D8_BIN" --min-api 24 --lib "$ANDROID_JAR" --output build-dex/out $(find build-dex/classes -name "*.class")
          mv build-dex/out/classes.dex build-dex/pranav_gate.dex
          ls -lh build-dex/pranav_gate.dex

      - name: Upload PRANAV Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PRANAV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Standalone pranav_gate.dex
        uses: actions/upload-artifact@v4
        with:
          name: pranav-gate-standalone-dex
          path: build-dex/pranav_gate.dex
          if-no-files-found: error

  render-server-check:
    name: Verify Render Admin Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & syntax check
        working-directory: render-admin-server
        run: |
          npm install --no-audit --no-fund
          node --check server.js
